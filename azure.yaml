# Azure Developer CLI project file — `azd provision` creates/updates the
# infrastructure in infra/ (App Service plan B1 + site + container registry).
#
# Image builds and deploys run in GitHub Actions
# (.github/workflows/azure-dev.yml): Azure for Students subscriptions cannot
# run ACR remote builds, and local builds would require a Docker install.
name: the-last-commit
metadata:
  template: the-last-commit@0.0.1
services:
  backend:
    project: ./
    language: docker
    host: appservice
