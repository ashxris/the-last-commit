[project]
name = "lastcommit"
version = "0.1.0"
description = "The Last Commit — an AI archaeologist that performs forensics on abandoned repositories and lets you interview their former maintainer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ashxris" }]
dependencies = [
    "pygit2>=1.15",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "fastembed>=0.4",
]

[project.scripts]
lastcommit = "lastcommit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastcommit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
