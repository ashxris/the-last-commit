name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    # stays skipped until `azd pipeline config` creates the federated
    # credentials and sets these repository variables
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure (federated credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure (Bicep)
        run: |
          az deployment group create \
            --resource-group rg-${{ vars.AZURE_ENV_NAME }} \
            --template-file infra/main.bicep \
            --parameters name=${{ vars.AZURE_ENV_NAME }} siteName=lastcommit-app groqApiKey="${{ secrets.GROQ_API_KEY }}"

      - name: Resolve container registry
        id: acr
        run: |
          ACR=$(az acr list -g "rg-${{ vars.AZURE_ENV_NAME }}" --query "[0].loginServer" -o tsv)
          echo "registry=$ACR" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        run: |
          az acr login --name "${{ steps.acr.outputs.registry }}"
          docker build -t "${{ steps.acr.outputs.registry }}/the-last-commit:latest" .
          docker push "${{ steps.acr.outputs.registry }}/the-last-commit:latest"

      - name: Roll out the new image
        run: |
          az webapp config container set \
            --name lastcommit-app \
            --resource-group "rg-${{ vars.AZURE_ENV_NAME }}" \
            --container-image-name "${{ steps.acr.outputs.registry }}/the-last-commit:latest"
          az webapp restart \
            --name lastcommit-app \
            --resource-group "rg-${{ vars.AZURE_ENV_NAME }}"
